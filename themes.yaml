# ---------------------------------------------------------------------------
# Colour and font themes
# ---------------------------------------------------------------------------
# The active theme is chosen in config.yaml (`theme:`).
# With `theme_switcher: true` in config.yaml, visitors get a small picker to
# preview every theme below. Turn it off before the site goes public.
#
# Fonts: any Google Fonts family name. `weights` is optional (default
# "400;500;600"); set it if a family doesn't offer those weights.
# `fallback` is used while the font loads or if it fails.
#
# Colours, for both `light` and `dark`:
#   paper         page background
#   surface       cards, header band, figure background
#   ink           headings and strong text
#   ink-2         body text
#   ink-3         muted text (dates, captions)
#   rule          thin dividers
#   rule-strong   section dividers, input borders
#   primary       main accent (honest points in the figure, buttons on hover)
#   primary-soft  light tint of primary (highlights, initials tiles)
#   adversary     the "attack" colour (adversarial points, current nav item)
#   link          link colour
#
# Every theme must define every colour in both modes; the build checks this.

navy:
  label: "Navy and red"
  fonts:
    heading: { family: "Literata", fallback: "Georgia, serif" }
    text: { family: "Hanken Grotesk", fallback: "'Helvetica Neue', Arial, sans-serif" }
  light:
    paper: "#f5f7fa"
    surface: "#ffffff"
    ink: "#14213d"
    ink-2: "#48526a"
    ink-3: "#6f7a90"
    rule: "#d9dee7"
    rule-strong: "#b9c1cf"
    primary: "#1f4e8c"
    primary-soft: "#dbe5f3"
    adversary: "#b3122e"
    link: "#1f4e8c"
  dark:
    paper: "#0f1a2b"
    surface: "#15233a"
    ink: "#e8edf5"
    ink-2: "#b2bccd"
    ink-3: "#8592a8"
    rule: "#26364f"
    rule-strong: "#3a4c69"
    primary: "#86b4f0"
    primary-soft: "#1d3150"
    adversary: "#ff6b7d"
    link: "#9cc3f5"

