# Sections appear on /people/ in this order. Rename or add sections freely.
# Within each section, people are sorted alphabetically by first name
# automatically; add `sort: false` to a section to keep the order written here.
#
# Fields per person:
#   name (required)
#   role:        e.g. "PhD student, since 2024" (optional; hidden when empty)
#   photo:       path inside static/, e.g. images/people/jane-doe.jpg (initials are shown if absent)
#   affiliation: optional second line under the role
#   bio:         one or two sentences, Markdown allowed
#   areas:       list of slugs from research.yaml
#   links:       website, scholar, github, linkedin, orcid, email
#   aliases:     other spellings used in author lists (for highlighting on /publications/)
#
# Alumni additionally take `years` and `now`.

