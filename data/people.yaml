# Sections appear on /people/ in this order. Rename or add sections freely.
# Within each section, people are sorted alphabetically by first name
# automatically; add `sort: false` to a section to keep the order written here.
# A section with `role_order` is sorted by role first (a role matches an entry
# when it starts with it, case-insensitively), then by first name. Everyone
# whose role matches no entry comes after, sorted by first name.
#
# Fields per person:
#   name (required)
#   role:        e.g. "PhD student, since 2024" (optional; hidden when empty)
#   photo:       path inside static/, e.g. images/people/jane-doe.jpg (initials are shown if absent)
#   affiliation: optional second line under the role
#   bio:         one or two sentences, Markdown allowed
#   areas:       list of slugs from research.yaml
#   links:       website, scholar, github, linkedin, orcid, email
#   aliases:     other spellings used in author lists (for highlighting on /publications/)
#
# Alumni additionally take `graduated` (the year they finished) and `now`.

sections:
  - title: "Faculty"
    members:
      - name: "El Mahdi El Mhamdi"
        aliases: ["El-Mahdi El-Mhamdi", "El Mahdi El-Mhamdi", "El-Mahdi El Mhamdi"]
        role: "Assistant Professor, group leader"
        affiliation: "CMAP, École Polytechnique"
        bio: >-
          Works on robust distributed learning, data poisoning and AI
          alignment. Co-inventor of the Krum and Bulyan aggregation rules;
          PhD from EPFL, previously a senior research scientist at Google.
        areas: [byzantine-learning, data-poisoning, collaborative-learning, ai-safety]
        links:
          website: "https://elmahdielmhamdi.com"
          scholar: "https://scholar.google.com/citations?user=kNA-WLQAAAAJ"

  - title: "Researchers and students"
    role_order: ["Postdoctoral researcher", "PhD student"]
    members:
      - name: "Adrien Majka"
        role: "PhD student"
        bio: >-
          Works on the alignment of machine learning algorithms, in particular
          on formalising Goodhart's law and what it implies for optimising
          proxy metrics.
        areas: [ai-safety]

      - name: "Abdessamad El-Kabid"
        role: "Research engineer"
        bio: >-
          Works on label-flipping attacks and how much harm weak, realistic
          adversaries can cause in distributed training.
        areas: [data-poisoning]

      - name: "Arthur Danjou"
        role: "Research intern, incoming PhD student (November 2026)"
        bio: >-
          Works on Byzantine-robust aggregation, dataset ownership
          verification and communication-efficient learning. Develops
          [Krum](https://github.com/calicarpa/krum), an open-source library
          of Byzantine-robust aggregation rules.
        areas: [byzantine-learning, data-poisoning]
        links:
          website: "https://arthurdanjou.fr/"

      - name: "Gilles Bareilles"
        role: "Postdoctoral researcher"
        bio: >-
          Works on the theory of robust aggregation and preference alignment.
          PhD from Université Grenoble Alpes (Laboratoire Jean Kuntzmann);
          previously a postdoc at the Czech Technical University in Prague.
        areas: [byzantine-learning, ai-safety]
        links:
          website: "https://gbareilles.fr"

      - name: "Hallison Paz"
        role: "Postdoctoral researcher"
        bio: >-
          Works on data poisoning and dataset ownership verification. PhD
          from IMPA; previously at Meta Reality Labs and Hand Talk.
        areas: [data-poisoning]
        links:
          website: "https://hallpaz.github.io"
          scholar: "https://scholar.google.com.br/citations?hl=en&user=Lb2XwsYAAAAJ"
          github: "https://github.com/hallpaz"
          email: "hallison.paz@polytechnique.edu"

      - name: "Jalal Baim"
        aliases: ["Mohamed Jalal Baim"]
        role: "Research engineer"
        bio: >-
          Works on membership inference and data leakage in fine-tuned
          language models, and on explainability for vision models. MSc in
          Applied Mathematics and Statistics from École Polytechnique.
        links:
          website: "https://jalalbaim.github.io/portfolio/"
          scholar: "https://scholar.google.com/citations?user=Vn39lHQAAAAJ"
          github: "https://github.com/Jalalbaim"

      - name: "Martin Beaufils"
        role: "PhD student"
        # TODO: bio, areas

      - name: "Nicole Osayande"
        role: "PhD student"
        affiliation: "Meta FAIR and IP Paris"
        bio: >-
          Works on LLM alignment and reasoning in social contexts, with a
          focus on responsible AI and algorithmic fairness. BSc from Queen's
          University and MSc from McGill University.
        areas: [ai-safety]

      - name: "Nour Hezbri"
        role: "PhD student"
        bio: >-
          Works on outlier activations in transformers and the effect of
          Dropout on these single points of failure.
        areas: [ai-safety]

      - name: "Xiaozhen Wang"
        role: "Postdoctoral researcher"
        bio: >-
          Works on entropic optimal transport and Sinkhorn-type algorithms,
